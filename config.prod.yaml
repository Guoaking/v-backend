port: 8082
gin_mode: "release"
log_level: "warn"
use_mock: false

app:
  frontend_base_url: "https://your-production-frontend-domain.com"

storage:
  upload:
    mode: local
    base_dir: /data/misc
    rules:
      # 规则 1: 视频上传路由 (原 ingest_dir 逻辑)
      - name: "liveness_videos"
        prefix: "videos/"
        target_dir: "/data/videos"

      # 规则 2: 图片上传路由
      - name: "identity_pics"
        prefix: "images/"
        target_dir: "/data/pic"
  access:
    # 默认保底策略：如果没匹配到规则，直接流式输出（适合本地开发）
    default_strategy: local_stream
    rules:
      # 业务 1: 人脸搜索数据
      - name: "face_search"
        match_prefix: "/data/dataset/"
        strategy: nginx_internal
        internal_prefix: "/_protected/storage/"
        strip_prefix: "/data/"

      # 业务 2: OCR 识别数据
      - name: "ocr_search"
        match_prefix: "/data/ocrset/"
        strategy: nginx_internal
        internal_prefix: "/_protected/storage/"
        strip_prefix: "/data/"

      # 业务 3: 远程 S3 资源 (未来扩展)
      - name: "remote_s3"
        match_prefix: "s3://"
        strategy: redirect

database:
  host: database
  port: 5432
  user: kong
  password: kongpassword
  dbname: kong
  sslmode: disable
  max_open_conns: 25
  max_idle_conns: 5
  auto_migrate_enabled: true

redis:
  host: redis
  port: 6379
  password: ""
  db: 0
  pool_size: 10
  min_idle_conns: 5
  max_retries: 3
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s

oauth:
  google:
    client_id: "481475455679-arokubdmn2dr9sv5999lavnbinpf5mct.apps.googleusercontent.com"
    client_secret: "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"
    redirect_url: "https://open.verilocale.com/api/v1/auth/google/callback"
    frontend_return_url: "https://open.verilocale.com/console"

