monitoring:
  metrics:
    enabled: true
    port: 9090
    path: "/metrics"
    namespace: "kyc"
    subsystem: "service"
    push_interval: "30s"
    histogram_buckets: [0.1, 0.5, 1, 2, 5, 10]

  tracing:
    enabled: true
    service_name: "kyc-service"
    service_version: "1.0.0"
    environment: "development"
    jaeger_endpoint: "http://localhost:14268/api/traces"
    sample_rate: 1.0
    log_spans: false
